name: Workflow integration

# Provisions the pinned Snakemake and Conda, then runs the workflow tests including
# per-rule Conda environments, so rule-environment updates are proven before merge.
on:
  push:
    branches: [main]
    paths:
      - workflows/**
      - tests/workflows/**
      - .github/workflows/workflow-integration.yml
  pull_request:
    paths:
      - workflows/**
      - tests/workflows/**
      - .github/workflows/workflow-integration.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snakemake:
    strategy:
      fail-fast: false
      matrix:
        # Add macos-latest once the repository is public; private macOS minutes are
        # billed at ten times the Linux rate. macOS arm64 is where parasail native
        # builds have failed before.
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      CONDA_PKGS_DIRS: ${{ github.workspace }}/../conda-pkgs
      RUN_SNAKEMAKE_CONDA_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Mirrors the managed runtime in src/tooling/policy.ts: Pixi, Snakemake, and Conda versions.
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.79.0
          run-install: false
          global-environments: |
            --environment byteowlsGenopilot --channel conda-forge --channel bioconda snakemake=9.26.1 conda=25.11.1
          global-cache: true
      - run: echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/../conda-pkgs
          key: conda-pkgs-${{ runner.os }}-${{ hashFiles('workflows/shared/envs/**') }}
      - run: snakemake --version && conda --version
      - run: python3 -m unittest discover -s tests -p "test_*.py"
