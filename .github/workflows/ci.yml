name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # macOS runners are billed at ten times the Linux rate for private repositories, so macOS
        # runs only once the repository is public.
        os: ${{ github.event.repository.private && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Installs the pnpm version declared in package.json's packageManager field.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm pack:local
      # Installs the tarball into a clean prefix: the bundle must start without node_modules.
      - run: pnpm verify:package
      # Direct-Snakemake tests skip themselves here; run them locally with
      # RUN_SNAKEMAKE_CONDA_INTEGRATION=1 (see README).
      - run: python3 -m unittest discover -s tests -p "test_*.py"
