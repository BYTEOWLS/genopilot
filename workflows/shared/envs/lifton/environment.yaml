name: lifton
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11.16
  - minimap2=2.31
  - miniprot=0.18
  # LiftOn depends on parasail. Install its native library through conda so
  # pip does not attempt a failing source build on macOS arm64.
  - parasail-python=1.3.4
  - pip
  - pip:
      - lifton==1.0.13
