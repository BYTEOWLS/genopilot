schema_version: 1
parameters:
  - id: reference-source
    label: Reference source
    section: Inputs
    kind: choice
    required: true
    default: ncbi
    hidden: false
    options:
      - value: local
        label: Local file
      - value: ncbi
        label: NCBI accession
  - id: reference-fasta
    label: Reference FASTA
    section: Inputs
    kind: file
    required: true
    default: null
    hidden: false
    visible_when:
      parameter: reference-source
      equals: local
  - id: reference-gff3
    label: Reference GFF3
    section: Inputs
    kind: file
    required: true
    default: null
    hidden: false
    visible_when:
      parameter: reference-source
      equals: local
  - id: reference-accession
    label: Reference NCBI accession
    section: Inputs
    kind: accession
    required: true
    default: null
    hidden: false
    visible_when:
      parameter: reference-source
      equals: ncbi
  - id: target-source
    label: Target source
    section: Inputs
    kind: choice
    required: true
    default: ncbi
    hidden: false
    options:
      - value: local
        label: Local file
      - value: ncbi
        label: NCBI accession
  - id: target-fasta
    label: Target FASTA
    section: Inputs
    kind: file
    required: true
    default: null
    hidden: false
    visible_when:
      parameter: target-source
      equals: local
  - id: target-accession
    label: Target NCBI accession
    section: Inputs
    kind: accession
    required: true
    default: null
    hidden: false
    visible_when:
      parameter: target-source
      equals: ncbi
  - id: lifton-profile
    label: LiftOn profile
    section: Workflow options
    kind: fixed
    required: true
    hidden: true
    default: same-species
  - id: output-root
    label: Output directory
    section: Run details
    kind: text
    required: true
    default: runs
    hidden: false
  - id: run-name
    label: Run name
    section: Run details
    kind: text
    required: false
    default: null
    hidden: false
  - id: run-description
    label: Run description
    section: Run details
    kind: text
    required: false
    default: null
    hidden: false
  - id: cpu-allocation
    label: CPU allocation
    section: Run details
    kind: choice
    required: true
    default: automatic
    hidden: false
    options:
      - value: automatic
        label: Automatic (all available CPUs)
      - value: leave-one-free
        label: Leave one CPU free
      - value: manual
        label: Manual limit
  - id: manual-cpu-limit
    label: Requested CPU limit
    section: Run details
    kind: integer
    required: true
    default: null
    hidden: false
    visible_when:
      parameter: cpu-allocation
      equals: manual
  - id: annotation-id-regex
    label: Annotation ID find (regex)
    section: Post processing
    kind: text
    required: false
    default: null
    hidden: false
  - id: annotation-id-prefix
    label: Annotation ID replacement
    section: Post processing
    kind: text
    required: false
    default: null
    hidden: false
