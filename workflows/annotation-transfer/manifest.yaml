schema_version: 1
workflow_version: 1
id: annotation-transfer
label: Transfer genome annotation
description: >
  Transfer a GFF3 annotation from a reference genome to a target genome.
entry_snakefile: Snakefile
parameter-definitions: manifest.parameters.yaml
stages:
  - id: resolve-inputs
    label: Resolve inputs
    description: >
      Normalize each local or NCBI input into a checksummed copy inside the run
      directory before any scientific rule runs.
    rules: [resolve_reference, resolve_target]
  - id: validate-inputs
    label: Validate inputs
    description: Validate the input FASTA and GFF3 files and their relationships.
    rules: [validate_inputs]
  - id: transfer-annotation
    label: Transfer annotation
    description: Run LiftOn and preserve its raw annotation and diagnostics.
    rules: [transfer_annotation]
  - id: validate-annotation
    label: Validate transferred annotation
    description: Validate the structure and relationships of LiftOn's GFF3.
    rules: [validate_annotation]
  - id: summarize-results
    label: Summarize results
    description: Collect transfer metrics, the per-feature report, and the completion summary.
    rules: [summarize_annotation_transfer]
  - id: record-provenance
    label: Record provenance
    description: Checksum produced artifacts and persist workflow execution provenance.
    rules: [record_annotation_transfer_provenance]
artifacts:
  - id: input-validation
    label: Input validation report
    path: results/input-validation.json
    type: json
    produced_by: validate-inputs
  - id: raw-gff3
    label: Raw LiftOn GFF3
    description: Unmodified annotation produced by LiftOn.
    path: results/annotation/lifton.raw.gff3
    type: gff3
    produced_by: transfer-annotation
  - id: lifton-diagnostics
    label: LiftOn diagnostics
    description: >
      LiftOn's own liftoff/miniprot/stats/intermediate_files subdirectories,
      alongside the raw GFF3 since LiftOn derives this path from `-o`.
    path: results/annotation/lifton_output
    type: directory
    produced_by: transfer-annotation
  - id: annotation-validation
    label: Annotation validation report
    path: results/validation.json
    type: json
    produced_by: validate-annotation
  - id: feature-transfer
    label: Per-feature transfer report
    description: Mapping status and target placement for each reference top-level feature.
    path: results/feature-transfer.tsv
    type: tsv
    produced_by: summarize-results
  - id: transfer-metrics
    label: Annotation transfer metrics
    path: results/metrics.json
    type: json
    produced_by: summarize-results
  - id: completion-summary
    label: Completion summary
    path: results/summary.json
    type: json
    produced_by: summarize-results
  - id: artifact-index
    label: Artifact index
    description: Checksummed records for resolved inputs, scientific results, logs, and benchmarks.
    path: artifacts.yaml
    type: yaml
    produced_by: record-provenance
  - id: run-provenance
    label: Run provenance
    description: Effective configuration, commands, tool versions, resources, and input provenance.
    path: provenance/run.json
    type: json
    produced_by: record-provenance
