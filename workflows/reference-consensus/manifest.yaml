schema_version: 1
workflow_version: 1
id: reference-consensus
label: Build a reference-guided cohort consensus
description: >
  Build one consensus genome for a cohort of isolates from their paired Illumina reads. Each
  isolate is compared with a backbone assembly and gets its own genome; the isolates, and
  optionally the backbone, then vote at every position for the cohort consensus. Uncertain and
  tied positions are reported for review.
entry_snakefile: Snakefile
parameter-definitions: manifest.parameters.yaml
stages:
  - id: resolve-inputs
    label: Resolve backbone
    description: >
      Normalize the local or NCBI backbone into a checksummed copy inside the run directory before
      any scientific rule runs.
    rules: [resolve_backbone]
  - id: validate-inputs
    label: Validate inputs
    description: >
      Validate the backbone FASTA and check that every read file of the isolate snapshot is present.
    rules: [validate_run_inputs]
  - id: process-isolates
    label: Process isolates
    description: >
      Trim, align, and call every isolate independently against the backbone, then build its
      callable mask, normalized variants, and reference-guided FASTA.
    rules:
      - index_backbone
      - validate_read_pair
      - trim_read_pair
      - align_read_pair
      - mark_duplicates
      - alignment_metrics
      - call_all_sites
      - classify_callability
      - filter_normalize_variants
      - build_isolate_consensus
      - summarize_isolate
    per_isolate:
      read_pair_rules: [validate_read_pair, trim_read_pair, align_read_pair]
      isolate_rules:
        - mark_duplicates
        - alignment_metrics
        - call_all_sites
        - classify_callability
        - filter_normalize_variants
        - build_isolate_consensus
        - summarize_isolate
  - id: aggregate-support
    label: Aggregate cohort support
    description: Combine the backbone and callable isolate votes into a per-position support table.
    rules: [aggregate_support]
  - id: generate-consensus
    label: Generate consensus
    description: Select the cohort allele at each position with the configured voting method.
  - id: record-provenance
    label: Record provenance
    description: Checksums, tool versions, and commands of the whole run.
    rules: [record_consensus_provenance]
artifacts:
  - id: resolved-backbone
    label: Resolved backbone FASTA
    description: The checksummed copy of the backbone every later rule consumes.
    path: resolved/backbone.fasta
    type: fasta
    produced_by: resolve-inputs
  - id: input-validation
    label: Input validation report
    path: results/input-validation.json
    type: json
    produced_by: validate-inputs
  - id: support-sites
    label: Support table (sites)
    description: >
      One row per variant locus: the backbone allele, every voted allele with its votes, flags, and
      each isolate's allele or state.
    path: results/cohort/initial/support-sites.tsv.gz
    type: tsv
    produced_by: aggregate-support
  - id: support-intervals
    label: Support table (intervals)
    description: Every backbone base in runs of constant votes, with every isolate's callability state.
    path: results/cohort/initial/support-intervals.tsv.gz
    type: tsv
    produced_by: aggregate-support
  - id: support-summary
    label: Support summary
    description: Vote and callability histograms, site counts per flag, and per-isolate counts.
    path: results/cohort/initial/support-summary.json
    type: json
    produced_by: aggregate-support
  - id: artifact-index
    label: Artifact index
    description: Checksummed records of the backbone, every isolate's results, logs, and benchmarks.
    path: artifacts.yaml
    type: yaml
    produced_by: record-provenance
  - id: run-provenance
    label: Run provenance
    description: Effective configuration, commands, tool versions, resources, and input provenance.
    path: provenance/run.json
    type: json
    produced_by: record-provenance
